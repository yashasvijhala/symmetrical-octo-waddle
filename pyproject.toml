[project]
name = "forecasting-service"
version = "1.0.0"
description = "API-first training, backtesting, and forecasting service for panel time series"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "joblib>=1.5",
    "lightgbm>=4.6",
    "numpy>=2.0",
    "polars>=1.32",
    "pyarrow>=20",
    "pydantic-settings>=2.10",
    "psycopg[binary,pool]>=3.2",
    "scikit-learn>=1.7",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
autogluon = ["autogluon.timeseries>=1.6,<1.7"]

[project.scripts]
forecast-api = "forecasting_service.main:run"
forecast-db = "forecasting_service.db:main"

[dependency-groups]
dev = [
    "httpx2>=2.12",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.12",
    "ty>=0.0.78",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forecasting_service"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.src]
include = ["src", "tests"]
