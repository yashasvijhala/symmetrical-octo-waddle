services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      FORECAST_ENVIRONMENT: ${FORECAST_ENVIRONMENT:-local}
      FORECAST_STATE_DIR: /var/lib/forecasting
      FORECAST_DATABASE_URL: ${FORECAST_DATABASE_URL:-postgresql://host.docker.internal:5432/symmetrical-octo-waddle}
      FORECAST_DATABASE_POOL_MIN_SIZE: 1
      FORECAST_DATABASE_POOL_MAX_SIZE: 10
      FORECAST_API_KEYS: '${FORECAST_API_KEYS:-{}}'
      HATCHET_CLIENT_TOKEN: ${HATCHET_CLIENT_TOKEN:-}
    volumes:
      - forecast-state:/var/lib/forecasting
    restart: unless-stopped

  worker-cpu:
    build: .
    command: ["/app/.venv/bin/forecast-worker", "--kind", "cpu"]
    environment:
      FORECAST_ENVIRONMENT: ${FORECAST_ENVIRONMENT:-local}
      FORECAST_STATE_DIR: /var/lib/forecasting
      FORECAST_DATABASE_URL: ${FORECAST_DATABASE_URL:-postgresql://host.docker.internal:5432/symmetrical-octo-waddle}
      FORECAST_DATABASE_POOL_MIN_SIZE: 1
      FORECAST_DATABASE_POOL_MAX_SIZE: 4
      FORECAST_CPU_WORKER_SLOTS: ${FORECAST_CPU_WORKER_SLOTS:-2}
      FORECAST_TENANT_MAX_CONCURRENT_JOBS: ${FORECAST_TENANT_MAX_CONCURRENT_JOBS:-2}
      HATCHET_CLIENT_TOKEN: ${HATCHET_CLIENT_TOKEN:-}
    volumes:
      - forecast-state:/var/lib/forecasting
    healthcheck:
      disable: true
    restart: unless-stopped

  worker-gpu:
    profiles: ["gpu"]
    build:
      context: .
      args:
        FORECAST_EXTRAS: autogluon
    command: ["/app/.venv/bin/forecast-worker", "--kind", "gpu"]
    environment:
      FORECAST_ENVIRONMENT: ${FORECAST_ENVIRONMENT:-local}
      FORECAST_STATE_DIR: /var/lib/forecasting
      FORECAST_DATABASE_URL: ${FORECAST_DATABASE_URL:-postgresql://host.docker.internal:5432/symmetrical-octo-waddle}
      FORECAST_DATABASE_POOL_MIN_SIZE: 1
      FORECAST_DATABASE_POOL_MAX_SIZE: 2
      FORECAST_GPU_WORKER_SLOTS: ${FORECAST_GPU_WORKER_SLOTS:-1}
      FORECAST_TENANT_MAX_CONCURRENT_JOBS: ${FORECAST_TENANT_MAX_CONCURRENT_JOBS:-2}
      HATCHET_CLIENT_TOKEN: ${HATCHET_CLIENT_TOKEN:-}
    volumes:
      - forecast-state:/var/lib/forecasting
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  forecast-state:
